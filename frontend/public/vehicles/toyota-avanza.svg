<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStudio4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="avanzaSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="glassTint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="wheelCar" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="90%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="shadowCar" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgStudio4)"/>
  <!-- Realistic Vehicle Floor Contact Shadow -->
  <ellipse cx="400" cy="375" rx="330" ry="22" fill="#0f172a" opacity="0.28"/>
  <ellipse cx="400" cy="375" rx="260" ry="12" fill="#0f172a" opacity="0.35"/>

  <g filter="url(#shadowCar)">
    <!-- Car Lower Underside -->
    <path d="M140 320 L660 320 L660 340 L140 340 Z" fill="#0f172a"/>

    <!-- Rear Wheel -->
    <circle cx="230" cy="330" r="54" fill="url(#wheelCar)"/>
    <circle cx="230" cy="330" r="38" fill="#e2e8f0"/>
    <circle cx="230" cy="330" r="30" fill="#64748b"/>
    <circle cx="230" cy="330" r="14" fill="#cbd5e1"/>
    <!-- 5-Spoke Car Alloy -->
    <path d="M230 294 L230 366 M194 330 L266 330" stroke="#f8fafc" stroke-width="4"/>

    <!-- Front Wheel -->
    <circle cx="570" cy="330" r="54" fill="url(#wheelCar)"/>
    <circle cx="570" cy="330" r="38" fill="#e2e8f0"/>
    <circle cx="570" cy="330" r="30" fill="#64748b"/>
    <circle cx="570" cy="330" r="14" fill="#cbd5e1"/>
    <path d="M570 294 L570 366 M534 330 L606 330" stroke="#f8fafc" stroke-width="4"/>

    <!-- Main MPV Silhouette Body (Avanza 1.5G) -->
    <path d="
      M 130 315
      L 130 270
      C 130 250, 145 230, 175 220
      L 290 160
      C 320 145, 480 145, 520 155
      L 600 220
      L 660 250
      C 675 260, 675 285, 670 315
      L 625 315
      C 625 285, 515 285, 515 315
      L 285 315
      C 285 285, 175 285, 175 315
      Z
    " fill="url(#avanzaSilver)"/>

    <!-- Side Character Dynamic Swage Line -->
    <path d="M140 265 L660 275" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
    <path d="M160 305 L640 305" stroke="#94a3b8" stroke-width="2"/>

    <!-- Side Greenhouse Windows (7-Seater layout) -->
    <!-- Front Quarter Window -->
    <polygon points="515,165 590,220 540,220 500,165" fill="url(#glassTint)"/>
    <!-- Front Row Window -->
    <polygon points="415,160 490,160 530,220 415,220" fill="url(#glassTint)"/>
    <!-- Middle Row Window -->
    <polygon points="310,165 405,160 405,220 310,220" fill="url(#glassTint)"/>
    <!-- Rear Third Row Window -->
    <polygon points="205,215 300,170 300,220 205,220" fill="url(#glassTint)"/>

    <!-- Window Pillars (A, B, C, D) -->
    <line x1="410" y1="160" x2="410" y2="220" stroke="#0f172a" stroke-width="8"/>
    <line x1="305" y1="165" x2="305" y2="220" stroke="#0f172a" stroke-width="8"/>

    <!-- Door Seams & Handles -->
    <path d="M305 220 L305 315" stroke="#64748b" stroke-width="2"/>
    <path d="M410 220 L410 315" stroke="#64748b" stroke-width="2"/>
    <!-- Chrome Door Handles -->
    <rect x="375" y="235" width="22" height="6" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="480" y="235" width="22" height="6" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>

    <!-- Front Grille & Headlight (Avanza horizontal bar grille) -->
    <polygon points="630,240 668,255 660,270 622,260" fill="#e0f2fe"/>
    <path d="M635 245 L665 255" stroke="#38bdf8" stroke-width="3"/>
    <!-- Chrome Upper Grille -->
    <path d="M620 262 L665 272" stroke="#ffffff" stroke-width="4"/>
    <path d="M615 272 L665 282" stroke="#475569" stroke-width="3"/>

    <!-- Rear Tail Light -->
    <polygon points="130,250 148,255 142,280 130,275" fill="#ef4444"/>

    <!-- Side Mirror -->
    <polygon points="505,215 530,210 535,225 510,228" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  </g>

  <rect x="36" y="32" width="130" height="28" rx="8" fill="#2563eb" fill-opacity="0.1"/>
  <text x="48" y="51" font-family="sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">MOBIL • 7 KURSI</text>
</svg>
