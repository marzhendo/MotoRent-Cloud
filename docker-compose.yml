version: '3.8'

services:
  # Distributed Backend Instance 1 (simulating AWS EC2 Availability Zone A)
  backend-node1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motorent-backend-node1
    environment:
      - INSTANCE_ID=ec2-ap-southeast-3a-node1
      - ALLOWED_ORIGINS=*
    ports:
      - "8001:8000"
    restart: unless-stopped

  # Distributed Backend Instance 2 (simulating AWS EC2 Availability Zone B)
  backend-node2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motorent-backend-node2
    environment:
      - INSTANCE_ID=ec2-ap-southeast-3b-node2
      - ALLOWED_ORIGINS=*
    ports:
      - "8002:8000"
    restart: unless-stopped

  # Application Load Balancer / Reverse Proxy (Simulating AWS ALB)
  load-balancer:
    image: nginx:alpine
    container_name: motorent-load-balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend-node1
      - backend-node2
    restart: unless-stopped
