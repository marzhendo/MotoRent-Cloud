<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStudio" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="nmaxBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="windshield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="wheelRubber" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="90%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="headlightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="carShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="450" fill="url(#bgStudio)"/>

  <!-- Studio Floor Shadow -->
  <ellipse cx="400" cy="380" rx="310" ry="24" fill="#0f172a" opacity="0.18"/>
  <ellipse cx="400" cy="380" rx="240" ry="14" fill="#0f172a" opacity="0.22"/>

  <!-- Scooter Illustration -->
  <g filter="url(#carShadow)">
    <!-- Rear Wheel -->
    <circle cx="250" cy="320" r="62" fill="url(#wheelRubber)"/>
    <circle cx="250" cy="320" r="42" fill="#334155"/>
    <circle cx="250" cy="320" r="34" fill="#1e293b"/>
    <circle cx="250" cy="320" r="16" fill="#64748b"/>
    <!-- Rear Brake Disc -->
    <circle cx="250" cy="320" r="28" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="6,4"/>

    <!-- Front Wheel -->
    <circle cx="560" cy="320" r="62" fill="url(#wheelRubber)"/>
    <circle cx="560" cy="320" r="42" fill="#334155"/>
    <circle cx="560" cy="320" r="34" fill="#1e293b"/>
    <circle cx="560" cy="320" r="16" fill="#64748b"/>
    <circle cx="560" cy="320" r="28" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="6,4"/>

    <!-- Exhaust Pipe & Engine Casing -->
    <path d="M220 330 L340 330 C360 330 380 320 380 300 L250 300 Z" fill="#334155"/>
    <path d="M220 320 L350 295 C365 290 380 295 385 305 L375 320 L230 336 Z" fill="#0f172a"/>
    <rect x="230" y="302" width="120" height="18" rx="8" fill="#475569"/>

    <!-- Main Chassis / Floorboard -->
    <path d="M270 310 L480 310 L520 250 L460 250 L380 280 L290 280 Z" fill="#1e293b"/>

    <!-- Underbone & Body Panels -->
    <path d="M240 270 L340 270 L390 240 L470 230 L530 200 L560 250 L530 290 L480 290 L440 250 L340 280 Z" fill="url(#nmaxBody)"/>

    <!-- Front Cowl & Aerodynamic Fairing -->
    <path d="M470 220 L530 180 L580 200 L560 280 L520 280 Z" fill="url(#nmaxBody)"/>

    <!-- High Windshield -->
    <path d="M510 185 L530 120 C535 110 550 110 555 120 L575 190 Z" fill="url(#windshield)"/>
    <path d="M525 150 L555 130" stroke="#bae6fd" stroke-width="3" stroke-linecap="round"/>

    <!-- Handlebars -->
    <path d="M490 180 L520 170 L540 175" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
    <circle cx="485" cy="182" r="6" fill="#334155"/>

    <!-- Stepped Dual Saddle (Seat) -->
    <path d="M240 260 C260 230 310 230 350 250 C380 250 420 245 440 245 L430 265 L240 265 Z" fill="#090d16"/>
    <path d="M245 255 C270 238 310 238 345 252" stroke="#475569" stroke-width="2"/>

    <!-- Front Telescopic Fork -->
    <line x1="535" y1="210" x2="560" y2="320" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>

    <!-- LED Dual Projector Headlight -->
    <polygon points="560,225 585,230 565,250" fill="#e0f2fe"/>
    <circle cx="575" cy="235" r="14" fill="url(#headlightGlow)"/>

    <!-- Premium Silver / Cyan Badge Line -->
    <path d="M360 258 L460 248" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <text x="375" y="272" font-family="sans-serif" font-size="11" font-weight="800" fill="#94a3b8" letter-spacing="2">NMAX 155</text>
  </g>

  <!-- Tag / Watermark -->
  <rect x="36" y="32" width="130" height="28" rx="8" fill="#1e3a8a" fill-opacity="0.1"/>
  <text x="48" y="51" font-family="sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">MOTOR • MATIC</text>
</svg>
