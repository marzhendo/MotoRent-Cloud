<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStudio2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="varioBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="darkAccents" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="wheelRubber2" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="90%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="shadow2" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgStudio2)"/>
  <ellipse cx="400" cy="380" rx="310" ry="24" fill="#0f172a" opacity="0.18"/>
  <ellipse cx="400" cy="380" rx="230" ry="14" fill="#0f172a" opacity="0.22"/>

  <g filter="url(#shadow2)">
    <!-- Rear Wheel -->
    <circle cx="260" cy="320" r="60" fill="url(#wheelRubber2)"/>
    <circle cx="260" cy="320" r="40" fill="#334155"/>
    <circle cx="260" cy="320" r="32" fill="#0f172a"/>
    <!-- 5-spoke Y-pattern alloy rim -->
    <path d="M260 288 L260 352 M228 320 L292 320" stroke="#94a3b8" stroke-width="4"/>

    <!-- Front Wheel -->
    <circle cx="560" cy="320" r="60" fill="url(#wheelRubber2)"/>
    <circle cx="560" cy="320" r="40" fill="#334155"/>
    <circle cx="560" cy="320" r="32" fill="#0f172a"/>
    <path d="M560 288 L560 352 M528 320 L592 320" stroke="#94a3b8" stroke-width="4"/>

    <!-- Sporty Sharp Exhaust -->
    <polygon points="220,330 330,300 370,300 380,312 330,332 230,342" fill="url(#darkAccents)"/>
    <polygon points="340,302 368,302 376,310 340,318" fill="#e2e8f0"/>

    <!-- Angular Floorboard & Lower Fairing -->
    <polygon points="300,310 490,310 460,270 330,270" fill="#1e293b"/>

    <!-- Aggressive Body Panels (Red & Black) -->
    <polygon points="230,265 330,265 390,235 480,225 510,200 480,240 370,265 240,285" fill="url(#varioBody)"/>
    <polygon points="360,250 420,210 460,210 450,235" fill="url(#darkAccents)"/>

    <!-- Front Sharp Nose Cowling -->
    <polygon points="480,230 540,180 580,215 570,270 515,280" fill="url(#varioBody)"/>
    <polygon points="500,210 545,175 560,195 530,225" fill="#0f172a"/>

    <!-- Handlebar & Sporty Visor -->
    <polygon points="510,175 535,150 555,160 535,182" fill="#0f172a"/>
    <path d="M495 168 L530 155 L555 160" stroke="#090d16" stroke-width="10" stroke-linecap="round"/>

    <!-- Sporty Seat (Contoured Red Stitching) -->
    <path d="M235 258 C265 235 320 235 365 245 C400 242 435 240 445 240 L435 260 L235 260 Z" fill="#0f172a"/>
    <path d="M245 252 C275 240 315 240 360 248" stroke="#dc2626" stroke-width="2"/>

    <!-- Front Fork -->
    <line x1="535" y1="210" x2="560" y2="320" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>

    <!-- Angular Dual LED Headlight (V-Shape DRL) -->
    <polygon points="555,225 580,220 575,235 558,242" fill="#67e8f9"/>
    <polygon points="550,245 568,240 562,252" fill="#e0f2fe"/>

    <!-- Vario 160 Graphics Tag -->
    <text x="350" y="280" font-family="sans-serif" font-size="12" font-weight="900" fill="#f87171" font-style="italic">VARIO 160</text>
  </g>

  <rect x="36" y="32" width="130" height="28" rx="8" fill="#dc2626" fill-opacity="0.1"/>
  <text x="48" y="51" font-family="sans-serif" font-size="12" font-weight="700" fill="#b91c1c">MOTOR • MATIC</text>
</svg>
