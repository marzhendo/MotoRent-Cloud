<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStudio3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="beatBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="wheelRubber3" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="90%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="shadow3" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgStudio3)"/>
  <ellipse cx="400" cy="380" rx="290" ry="22" fill="#0f172a" opacity="0.18"/>
  <ellipse cx="400" cy="380" rx="210" ry="12" fill="#0f172a" opacity="0.2"/>

  <g filter="url(#shadow3)">
    <!-- Compact Rear Wheel -->
    <circle cx="270" cy="326" r="56" fill="url(#wheelRubber3)"/>
    <circle cx="270" cy="326" r="38" fill="#334155"/>
    <circle cx="270" cy="326" r="28" fill="#0f172a"/>
    <circle cx="270" cy="326" r="12" fill="#94a3b8"/>

    <!-- Compact Front Wheel -->
    <circle cx="550" cy="326" r="56" fill="url(#wheelRubber3)"/>
    <circle cx="550" cy="326" r="38" fill="#334155"/>
    <circle cx="550" cy="326" r="28" fill="#0f172a"/>
    <circle cx="550" cy="326" r="12" fill="#94a3b8"/>

    <!-- Slender Exhaust -->
    <polygon points="230,336 320,312 360,314 366,324 320,338 240,346" fill="#1e293b"/>
    <rect x="250" y="322" width="80" height="10" rx="5" fill="#475569"/>

    <!-- Compact Floorboard -->
    <polygon points="310,316 480,316 460,280 340,280" fill="#0f172a"/>

    <!-- Agile Body Side Cover -->
    <polygon points="250,275 340,272 385,246 460,238 480,215 460,250 360,270 260,290" fill="url(#beatBody)"/>
    <polygon points="340,260 380,225 425,225 410,248" fill="#0284c7"/>

    <!-- Head Cowl & Front Fender -->
    <polygon points="460,240 515,190 550,225 540,275 490,285" fill="url(#beatBody)"/>
    <polygon points="480,225 520,185 535,205 505,235" fill="#0f172a"/>

    <!-- Handlebar -->
    <path d="M485 178 L510 166 L530 172" stroke="#0f172a" stroke-width="9" stroke-linecap="round"/>

    <!-- Compact Slim Seat -->
    <path d="M250,268 C275,248 320,248 360,255 C390,252 420,250 435,250 L425,268 L250,268 Z" fill="#090d16"/>

    <!-- Front Telescopic Suspension -->
    <line x1="515" y1="215" x2="550" y2="326" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>

    <!-- Modern LED Headlamp -->
    <polygon points="530,235 550,230 545,245" fill="#e0f2fe"/>
    <circle cx="538" cy="238" r="8" fill="#38bdf8" opacity="0.6"/>

    <!-- BeAT Deluxe Typography -->
    <text x="350" y="285" font-family="sans-serif" font-size="11" font-weight="800" fill="#0284c7" letter-spacing="1">BEAT DELUXE</text>
  </g>

  <rect x="36" y="32" width="130" height="28" rx="8" fill="#0284c7" fill-opacity="0.1"/>
  <text x="48" y="51" font-family="sans-serif" font-size="12" font-weight="700" fill="#0369a1">MOTOR • MATIC</text>
</svg>
