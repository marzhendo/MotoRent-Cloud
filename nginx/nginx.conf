events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Upstream backend pool demonstrating Round-Robin Load Balancing across multiple nodes
    upstream motorent_backend {
        # Round-Robin (default): Distributes incoming requests sequentially
        # Alternative: least_conn; (Least Connections)
        server backend-node1:8000 max_fails=3 fail_timeout=10s;
        server backend-node2:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend static files (when serving production bundle)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # API Reverse Proxy & Load Balancer
        location /api/ {
            proxy_pass http://motorent_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass telemetry headers back to browser
            proxy_pass_header X-Instance-Id;
        }
    }
}
